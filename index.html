<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARTEMIS AR/VR Services API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    #banner {
      background: #1b1f23; color: #fff; padding: 14px 20px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #banner strong { color: #7ee787; }
    #banner a { color: #79c0ff; }
  </style>
</head>
<body>
  <div id="banner">
    <strong>ARTEMIS AR/VR Services</strong> — ATHENA Research Center, WP9.2 &nbsp;·&nbsp;
    24 endpoints as specified in
    <a href="https://doi.org/10.5281/zenodo.20750197">Deliverable D9.2, Section 3.3</a>
    &nbsp;·&nbsp; the server is reachable over the project VPN only, so
    &ldquo;Try it out&rdquo; will not reach it from the public internet.
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = () => {
      // Browsers block fetch() from a file:// origin, so opening this page by
      // double-clicking it shows an opaque "Failed to fetch" error. Say what is
      // actually wrong instead. Over http(s) -- GitHub Pages included -- this
      // branch never runs.
      if (location.protocol === 'file:') {
        document.getElementById('swagger-ui').innerHTML =
          '<div style="max-width:46em;margin:3em auto;padding:1.5em 1.75em;border:1px solid #d0d7de;' +
          'border-radius:8px;font:15px/1.6 -apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;color:#1b1f23">' +
          '<h2 style="margin-top:0">Open this page over HTTP, not from the file system</h2>' +
          '<p>Browsers refuse to let a page loaded from <code>file://</code> fetch a local file, ' +
          'so the specification cannot be read this way.</p>' +
          '<p>From this directory, run:</p>' +
          '<pre style="background:#f6f8fa;padding:.9em 1em;border-radius:6px;overflow-x:auto">' +
          'python3 -m http.server 8899</pre>' +
          '<p>then open <a href="http://127.0.0.1:8899/">http://127.0.0.1:8899/</a>.</p>' +
          '<p style="color:#57606a;margin-bottom:0">Published on GitHub Pages the page is served over ' +
          'HTTPS, where this restriction does not apply. The specification itself is in ' +
          '<code>artemis-arvr-openapi.json</code> and can be opened in any OpenAPI viewer.</p></div>';
        return;
      }
      window.ui = SwaggerUIBundle({
        url: 'artemis-arvr-openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'StandaloneLayout'
      });
    };
  </script>
</body>
</html>
